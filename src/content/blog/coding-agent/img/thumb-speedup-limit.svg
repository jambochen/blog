<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <style>
    /* Loaded as an image, so page styles do not reach in: the greys are mid-tones that read on both the light and the dark page. */
    .serial { fill: #eb6c36; fill-opacity: 0.2; stroke: #eb6c36; stroke-width: 3; }
    .split { fill: #808892; fill-opacity: 0.2; stroke: #808892; stroke-width: 3; }
    .axis { fill: none; stroke: #808892; stroke-width: 2; stroke-linecap: round; }
    /* The orange part never shrinks, however far the grey part does. */
    .shared {
      transform-box: fill-box;
      transform-origin: left center;
      animation: share 5s ease-in-out infinite;
    }
    @keyframes share {
      0%, 15% { transform: scaleX(1); }
      45%, 80% { transform: scaleX(0.125); }
      100% { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .shared { animation: none; transform: scaleX(0.125); }
    }
  </style>
  <rect class="serial" x="30" y="44" width="30" height="36" rx="3" />
  <rect class="split" x="66" y="44" width="204" height="36" rx="3" />
  <rect class="serial" x="30" y="100" width="30" height="36" rx="3" />
  <rect class="split shared" x="66" y="100" width="204" height="36" rx="3" />
  <path class="axis" d="M30 160H270M30 160v8M90 160v8M150 160v8M210 160v8M270 160v8" />
</svg>

<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複製檔案與存檔點之別</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Diagram Design</p>
    <h1>複製檔案與存檔點之別</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="copies-vs-checkpoints-title copies-vs-checkpoints-desc">
        <title id="copies-vs-checkpoints-title">複製檔案與存檔點之別</title>
        <desc id="copies-vs-checkpoints-desc">靠複製檔案備份時，資料夾裡留下數份檔名相近的腳本；改用 Git 之後，資料夾裡每個檔案只有一份，歷史另存為一串附有說明文字與日期的存檔點。</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone A: 複製檔案 -->
        <rect x="40" y="40" width="880" height="112" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="44" width="72" height="20" fill="#f1f1f2"/>
        <text x="92" y="59" fill="rgba(45,49,66,0.55)" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">複製檔案</text>

        <!-- Zone B: Git 存檔點 -->
        <rect x="40" y="176" width="880" height="144" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="180" width="88" height="20" fill="#f1f1f2"/>
        <text x="100" y="195" fill="rgba(45,49,66,0.55)" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">Git 存檔點</text>

        <!-- Timeline baseline, zone B -->
        <line x1="374" y1="248" x2="798" y2="248" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- Zone A nodes: 並列的複本 -->
        <rect x="64" y="80" width="196" height="48" fill="#f5f5f5"/>
        <rect x="64" y="80" width="196" height="48" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="162" y="109" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">analysis.R</text>

        <rect x="276" y="80" width="196" height="48" fill="#f5f5f5"/>
        <rect x="276" y="80" width="196" height="48" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="374" y="108" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">analysis_v2.R</text>

        <rect x="488" y="80" width="196" height="48" fill="#f5f5f5"/>
        <rect x="488" y="80" width="196" height="48" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="586" y="108" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">analysis_final.R</text>

        <rect x="700" y="80" width="196" height="48" fill="#f5f5f5"/>
        <rect x="700" y="80" width="196" height="48" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="798" y="108" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">analysis_final_v2.R</text>

        <!-- Zone B node: 專案資料夾 -->
        <rect x="64" y="216" width="196" height="64" fill="#f5f5f5"/>
        <rect x="64" y="216" width="196" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="162" y="243" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">專案資料夾</text>
        <text x="162" y="265" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">每個檔案只有一份</text>

        <!-- Zone B events: 存檔點 -->
        <circle cx="374" cy="248" r="5" fill="#2d3142"/>
        <text x="374" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">清理原始資料</text>
        <text x="374" y="276" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10/02</text>

        <circle cx="586" cy="248" r="5" fill="#2d3142"/>
        <text x="586" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">加入迴歸模型</text>
        <text x="586" y="276" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10/05</text>

        <circle cx="798" cy="248" r="6" fill="#eb6c36"/>
        <text x="798" y="226" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">改用對數轉換</text>
        <text x="798" y="276" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10/08</text>

        <!-- Legend -->
        <line x1="40" y1="348" x2="920" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <circle cx="46" cy="364" r="6" fill="#eb6c36"/>
        <text x="64" y="369" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">專案目前的狀態</text>
      </svg>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <style>
    /* Loaded as an image, so page styles do not reach in: the greys are mid-tones that read on both the light and the dark page. */
    .line { fill: none; stroke: #808892; stroke-width: 3; stroke-linecap: round; }
    .text { stroke: #eb6c36; }
    .table { animation: leave 6s ease-in-out infinite; }
    .text { animation: arrive 6s ease-in-out infinite; }
    @keyframes leave {
      0%, 25% { opacity: 1; }
      40%, 85% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes arrive {
      0%, 25% { opacity: 0; }
      40%, 85% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .table { animation: none; opacity: 0; }
      .text { animation: none; opacity: 1; }
    }
  </style>
  <path class="line table" d="M60 46H240V154H60Z M60 82H240M60 118H240M120 46V154M180 46V154" />
  <path class="line text" d="M60 64H228M60 100H196M60 136H240" />
</svg>

<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複製貼上與函數之別</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Diagram Design</p>
    <h1>複製貼上與函數之別</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="paste-vs-function-title paste-vs-function-desc">
        <title id="paste-vs-function-title">複製貼上與函數之別</title>
        <desc id="paste-vs-function-desc">同一段清理步驟複製貼上三次時，三個年度的資料各有一份，其中有誤的一行須分別修改三處；寫成函數之後，三個年度的資料都交給同一個函數，有誤的一行只須修改一處。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="40" y="40" width="880" height="152" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="44" width="56" height="16" rx="2" fill="#f1f1f2"/>
        <text x="84.0" y="56" fill="rgba(45,49,66,0.55)" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">複製貼上</text>
        <rect x="64" y="76" width="264" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="76" width="264" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="84" y="100" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">data_2022.csv</text>
        <rect x="84" y="116" width="168" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="84" y="128" width="208" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="84" y="140" width="136" height="6" rx="3" fill="#eb6c36"/>
        <rect x="84" y="152" width="184" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="348" y="76" width="264" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="348" y="76" width="264" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="368" y="100" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">data_2023.csv</text>
        <rect x="368" y="116" width="168" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="368" y="128" width="208" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="368" y="140" width="136" height="6" rx="3" fill="#eb6c36"/>
        <rect x="368" y="152" width="184" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="632" y="76" width="264" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="76" width="264" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="652" y="100" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">data_2024.csv</text>
        <rect x="652" y="116" width="168" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="652" y="128" width="208" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="652" y="140" width="136" height="6" rx="3" fill="#eb6c36"/>
        <rect x="652" y="152" width="184" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="40" y="216" width="880" height="204" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="220" width="56" height="16" rx="2" fill="#f1f1f2"/>
        <text x="84.0" y="232" fill="rgba(45,49,66,0.55)" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">寫成函數</text>
        <line x1="260" y1="284" x2="624" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="260" y1="328" x2="624" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="260" y1="372" x2="624" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="64" y="268" width="196" height="32" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="268" width="196" height="32" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="162" y="288" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data_2022.csv</text>
        <rect x="64" y="312" width="196" height="32" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="312" width="196" height="32" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="162" y="332" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data_2023.csv</text>
        <rect x="64" y="356" width="196" height="32" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="356" width="196" height="32" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="162" y="376" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data_2024.csv</text>
        <rect x="632" y="260" width="264" height="136" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="260" width="264" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="652" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">clean()</text>
        <rect x="652" y="316" width="168" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="652" y="328" width="208" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
        <rect x="652" y="340" width="136" height="6" rx="3" fill="#eb6c36"/>
        <rect x="652" y="352" width="184" height="6" rx="3" fill="rgba(45,49,66,0.18)"/>
      </svg>
    </div>
  </div>
</body>
</html>

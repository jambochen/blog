<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <style>
    /* Loaded as an image, so page styles do not reach in: the greys are mid-tones that read on both the light and the dark page. */
    .line { fill: none; stroke: #808892; stroke-width: 3; stroke-linecap: round; }
    .box { fill: none; stroke: #808892; stroke-width: 3; }
    .llm { stroke: #eb6c36; fill: #eb6c36; fill-opacity: 0.14; }
    .token { fill: #eb6c36; animation: travel 6s ease-in-out infinite; }
    /* Out to the tools and back twice, then the answer returns to the user. */
    @keyframes travel {
      0% { transform: translateX(0); }
      12% { transform: translateX(96px); }
      24% { transform: translateX(192px); }
      36% { transform: translateX(96px); }
      48% { transform: translateX(192px); }
      60% { transform: translateX(96px); }
      75%, 100% { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .token { animation: none; transform: translateX(96px); }
    }
  </style>
  <path class="line" d="M84 100H120M180 100H216" />
  <rect class="box" x="24" y="76" width="60" height="48" rx="6" />
  <rect class="box llm" x="120" y="76" width="60" height="48" rx="6" />
  <rect class="box" x="216" y="76" width="60" height="48" rx="6" />
  <circle class="token" cx="54" cy="100" r="8" />
</svg>

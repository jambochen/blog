<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相加的先後與捨入</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Diagram Design</p>
    <h1>相加的先後與捨入</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="summation-order-title summation-order-desc">
        <title id="summation-order-title">相加的先後與捨入</title>
        <desc id="summation-order-desc">同樣是 0.1、0.2、0.3 三個數，循序版本先加前兩筆再加第三筆，得到 0.6000000000000001；平行版本由一個 worker 先算出後兩筆的小計 0.5，再與 0.1 相加，得到 0.6。</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="40" y="40" width="424" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="44" width="172" height="16" rx="2" fill="#f1f1f2"/>
        <text x="142.0" y="56" fill="rgba(45,49,66,0.55)" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">循序：由第一筆加到最後一筆</text>
        <path d="M 132 124 L 132 144 Q 132 152 140 152 L 184 152 Q 192 152 192 160 L 192 176" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 252 124 L 252 144 Q 252 152 244 152 L 200 152 Q 192 152 192 160 L 192 176" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 192 212 L 192 232 Q 192 240 200 240 L 244 240 Q 252 240 252 248 L 252 264" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 372 124 L 372 232 Q 372 240 364 240 L 260 240 Q 252 240 252 248 L 252 264" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="96.0" y="88" width="72" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="96.0" y="88" width="72" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="132" y="110" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.1</text>
        <rect x="216.0" y="88" width="72" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="216.0" y="88" width="72" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="252" y="110" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.2</text>
        <rect x="336.0" y="88" width="72" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="336.0" y="88" width="72" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="372" y="110" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.3</text>
        <rect x="100.0" y="176" width="184" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="100.0" y="176" width="184" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="192" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.30000000000000004</text>
        <rect x="160.0" y="264" width="184" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="160.0" y="264" width="184" height="36" rx="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
        <text x="252" y="286" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.6000000000000001</text>
        <text x="296" y="198" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">先加前兩筆</text>
        <rect x="496" y="40" width="424" height="296" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="512" y="44" width="168" height="16" rx="2" fill="#f1f1f2"/>
        <text x="596.0" y="56" fill="rgba(45,49,66,0.55)" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">平行：各 worker 先算小計</text>
        <path d="M 708 124 L 708 144 Q 708 152 716 152 L 760 152 Q 768 152 768 160 L 768 176" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 828 124 L 828 144 Q 828 152 820 152 L 776 152 Q 768 152 768 160 L 768 176" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 588 124 L 588 232 Q 588 240 596 240 L 700 240 Q 708 240 708 248 L 708 264" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 768 212 L 768 232 Q 768 240 760 240 L 716 240 Q 708 240 708 248 L 708 264" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="552.0" y="88" width="72" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="552.0" y="88" width="72" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="588" y="110" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.1</text>
        <rect x="672.0" y="88" width="72" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="672.0" y="88" width="72" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="708" y="110" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.2</text>
        <rect x="792.0" y="88" width="72" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="792.0" y="88" width="72" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="828" y="110" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.3</text>
        <rect x="720.0" y="176" width="96" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="720.0" y="176" width="96" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="768" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.5</text>
        <rect x="616.0" y="264" width="184" height="36" rx="6" fill="#f5f5f5"/>
        <rect x="616.0" y="264" width="184" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="708" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.6</text>
        <text x="588" y="80" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">worker 1</text>
        <text x="768" y="80" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">worker 2</text>
        <text x="708" y="198" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="end">小計</text>
        <line x1="40" y1="360" x2="920" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="40" y="370" width="20" height="12" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
        <text x="68" y="380" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">與另一種順序相差最後一位小數</text>
        <rect x="264" y="370" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="292" y="380" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="start">相加的結果</text>
      </svg>
    </div>
  </div>
</body>
</html>

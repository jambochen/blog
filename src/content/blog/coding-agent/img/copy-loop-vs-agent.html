<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網頁對話與 coding agent 之別</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>網頁對話與 coding agent 之別</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="copy-loop-vs-agent-title copy-loop-vs-agent-desc">
        <title id="copy-loop-vs-agent-title">網頁對話與 coding agent 之別</title>
        <desc id="copy-loop-vs-agent-desc">以網頁對話修改 code 時，使用者夾在網頁與電腦之間，來回複製 code 與結果；改用 coding agent 後，由 agent 直接在電腦上讀檔與執行，使用者只下指示。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone A: 網頁對話 -->
        <rect x="40" y="40" width="880" height="128" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="44" width="72" height="20" fill="#f1f1f2"/>
        <text x="92" y="59" fill="rgba(45,49,66,0.55)" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">網頁對話</text>

        <!-- Zone B: coding agent -->
        <rect x="40" y="192" width="880" height="128" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="56" y="196" width="104" height="20" fill="#f1f1f2"/>
        <text x="108" y="211" fill="rgba(45,49,66,0.55)" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">Coding agent</text>

        <!-- Arrows, zone A -->
        <line x1="208" y1="100" x2="408" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="408" y1="124" x2="208" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="552" y1="100" x2="752" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="752" y1="124" x2="552" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrows, zone B -->
        <line x1="208" y1="252" x2="408" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="408" y1="276" x2="208" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="552" y1="252" x2="752" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="752" y1="276" x2="552" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels, zone A -->
        <rect x="268" y="74" width="80" height="20" fill="#f1f1f2"/>
        <text x="308" y="89" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">複製 code</text>
        <rect x="250" y="130" width="116" height="20" fill="#f1f1f2"/>
        <text x="308" y="145" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">貼上或上傳結果</text>
        <rect x="608" y="74" width="88" height="20" fill="#f1f1f2"/>
        <text x="652" y="89" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">貼上並執行</text>
        <rect x="616" y="130" width="72" height="20" fill="#f1f1f2"/>
        <text x="652" y="145" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">複製結果</text>

        <!-- Arrow labels, zone B -->
        <rect x="286" y="226" width="44" height="20" fill="#f1f1f2"/>
        <text x="308" y="241" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">指示</text>
        <rect x="286" y="282" width="44" height="20" fill="#f1f1f2"/>
        <text x="308" y="297" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">回答</text>
        <rect x="588" y="226" width="128" height="20" fill="#f1f1f2"/>
        <text x="652" y="241" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">讀檔、改檔、執行</text>
        <rect x="630" y="282" width="44" height="20" fill="#f1f1f2"/>
        <text x="652" y="297" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">結果</text>

        <!-- Zone A nodes -->
        <rect x="64" y="80" width="144" height="64" fill="#f5f5f5"/>
        <rect x="64" y="80" width="144" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="136" y="109" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">網頁上的 LLM</text>
        <text x="136" y="127" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">給出 code 與建議</text>

        <rect x="408" y="80" width="144" height="64" fill="#f5f5f5"/>
        <rect x="408" y="80" width="144" height="64" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="480" y="109" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">使用者</text>
        <text x="480" y="127" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">來回複製與貼上</text>

        <rect x="752" y="80" width="144" height="64" fill="#f5f5f5"/>
        <rect x="752" y="80" width="144" height="64" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="824" y="109" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">電腦</text>
        <text x="824" y="127" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">檔案與執行環境</text>

        <!-- Zone B nodes -->
        <rect x="64" y="232" width="144" height="64" fill="#f5f5f5"/>
        <rect x="64" y="232" width="144" height="64" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="136" y="261" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">使用者</text>
        <text x="136" y="279" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">只下指示</text>

        <rect x="408" y="232" width="144" height="64" fill="#f5f5f5"/>
        <rect x="408" y="232" width="144" height="64" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="480" y="261" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">Coding agent</text>
        <text x="480" y="279" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">讀檔、執行、看結果</text>

        <rect x="752" y="232" width="144" height="64" fill="#f5f5f5"/>
        <rect x="752" y="232" width="144" height="64" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="824" y="261" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">電腦</text>
        <text x="824" y="279" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">檔案與執行環境</text>

        <!-- Legend -->
        <line x1="40" y1="348" x2="920" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="40" y="358" width="24" height="12" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="72" y="369" fill="#4f5d75" font-size="14" font-weight="500" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">在 LLM 與電腦之間搬運 code 與結果的一方</text>
      </svg>
    </div>
  </div>
</body>
</html>
